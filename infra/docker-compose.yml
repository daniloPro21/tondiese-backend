services:
  redis:
    image: redis:7
    container_name: tondise-redis
    ports:
      - "6379:6379"
    networks:
      - tondise-network
    restart: unless-stopped

  keycloak_db:
    image: postgres:16
    container_name: tondise-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - tondise-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: tondise-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    depends_on:
      - keycloak_db
    networks:
      - tondise-network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: tondise-minio
    environment:
      MINIO_ROOT_USER: tondise
      MINIO_ROOT_PASSWORD: tondise123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - tondise-network
    restart: unless-stopped

networks:
  tondise-network:
    driver: bridge

volumes:
  keycloak_db_data:
  minio_data:
