services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tondise
      POSTGRES_USER: tondise
      POSTGRES_PASSWORD: tondise
    ports:
      - "5432:5432"
    volumes:
      - tondise_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tondise
      MINIO_ROOT_PASSWORD: tondise123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tondise_minio_data:/data

volumes:
  tondise_postgres_data:
  tondise_minio_data:
