spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tondise_test}
    username: ${DB_USERNAME:tondise}
    password: ${DB_PASSWORD:tondise}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tondise}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis

tondise:
  identity-provider:
    keycloak:
      realm: ${KEYCLOAK_REALM:tondise}
      auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
      client-id: ${KEYCLOAK_CLIENT_ID:tondise-backend}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:changeme-dev-secret}
      public-client-id: ${KEYCLOAK_PUBLIC_CLIENT_ID:tondise-web}

s3:
  url: ${MINIO_URL:http://localhost:9000}
  access:
    name: ${MINIO_ACCESS_KEY:tondise}
    secret: ${MINIO_SECRET_KEY:tondise123}
  bucket:
    name: ${MINIO_BUCKET:tondise}
  folder: ${MINIO_FOLDER:products}

app:
  jwt:
    secret: test-only-secret-not-for-production-use-32-bytes-min
  cors:
    allowed-origins:
      - http://localhost:5173
  storage:
    type: local
    local:
      path: ./build/test-uploads
      public-url: http://localhost:8080/uploads
